services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: villagerai
      POSTGRES_USER: villagerai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - npc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U villagerai -d villagerai']
      interval: 3s
      timeout: 3s
      retries: 20
  service:
    build: .
    profiles: ['hosted']
    env_file: .env
    environment:
      AUTH_MODE: meta
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://villagerai:${POSTGRES_PASSWORD}@postgres:5432/villagerai
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - ./scopes.local.json:/app/scopes.local.json:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  npc-postgres:
